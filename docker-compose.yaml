services:
  metatube:
    image: metatube-server:v1.4.1-javdb.4
    container_name: metatube
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - http_proxy=${HTTP_PROXY:-}
      - https_proxy=${HTTPS_PROXY:-}
      - no_proxy=${NO_PROXY:-localhost,127.0.0.1}
      - MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_HOST=${MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_HOST:-}
      - MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_UUID=${MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_UUID:-}
      - MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_PASSWORD=${MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_PASSWORD:-}
      - MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_REFRESH_INTERVAL=${MT_MOVIE_PROVIDER_JAVDB__COOKIECLOUD_REFRESH_INTERVAL:-10m}
      - MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_HOST=${MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_HOST:-}
      - MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_UUID=${MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_UUID:-}
      - MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_PASSWORD=${MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_PASSWORD:-}
      - MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_REFRESH_INTERVAL=${MT_ACTOR_PROVIDER_JAVDBACTOR__COOKIECLOUD_REFRESH_INTERVAL:-10m}
    volumes:
      - run:/var/run
    command: -dsn "postgres://metatube:metatube@/metatube?host=/var/run/postgresql" -port 8080 -db-auto-migrate -db-prepared-stmt

  postgres:
    image: postgres:15-alpine
    container_name: metatube-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=metatube
      - POSTGRES_PASSWORD=metatube
      - POSTGRES_DB=metatube
    volumes:
      - ./db:/var/lib/postgresql/data
      - run:/var/run
    command: "-c TimeZone=Asia/Shanghai -c log_timezone=Asia/Shanghai -c listen_addresses='' -c unix_socket_permissions=0777"

volumes:
  run:
